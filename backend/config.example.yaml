# DataDev 后端配置模板
# 使用：复制为 backend/config.yaml（该文件已被 .gitignore 排除，不入库）。
# 密码一律通过环境变量注入，本文件只声明环境变量名，绝不写明文密码。

app_name: DataDev
app_version: 0.1.0
host: 127.0.0.1
port: 8000
debug: false

database:
  # SQLite MVP；未来切本地 MySQL 只需改 url（SQLAlchemy 抹平差异）
  url: sqlite+aiosqlite:///D:/AI/DataDev/data/dataflow.db
  echo: false

# ---- 集群对接（IP 直连，铁律 1：不存 hostname） ----

# HMS 元数据库（资产采集主路径，只读 SELECT）
hms:
  host: 192.168.10.102
  port: 3306
  database: metastore
  user: root
  password_env: DATAFLOW_HMS_PASSWORD

# HiveServer2（SQL 执行主通道，Thrift）
hs2:
  host: 192.168.10.102
  port: 10000
  user: hadoop
  password_env: DATAFLOW_HS2_PASSWORD

# DolphinScheduler OpenAPI（1.3.9，login + sessionId）
ds:
  base_url: http://192.168.10.102:12345
  user: admin
  password_env: DATAFLOW_DS_PASSWORD

# Ollama（AI 层，独立进程，不计入 2GB 预算）
ollama:
  base_url: http://127.0.0.1:11434
  model: qwen2.5-coder:7b
  timeout_sec: 120
